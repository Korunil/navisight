# configs/pretraining.yaml
experiment:
  name: "baseline_pretraining_v1"
  description: "Initial MAE pretraining on Piraeus AIS with full multimodal context."
  seed: 42
  schema_version: "v1.2.0"

data:
  window_size: 60
  stride_train: 30
  stride_inference: 10
  batch_size: 64
  num_workers: 4
  phase_balanced_sampling: true

model:
  d_model: 128
  n_heads: 8
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  projector:
    phys_out: 80
    ctx_out: 32
    qual_out: 16

masking:
  strategy: "random"      # Future: 'block', 'curriculum', 'modality'
  mask_ratio: 0.15

optimization:
  epochs: 50
  lr: 0.0001
  weight_decay: 0.00001
  clip_grad_norm: 1.0

diagnostics:
  monitor_effective_rank: true
  min_effective_rank_threshold: 32.0
  monitor_attention_entropy: true
  log_interval_steps: 100

checkpointing:
  save_dir: "models/checkpoints/"
  save_top_k: 3
  monitor_metric: "physics_mse"  # We save best checkpoints based on physics reconstruction